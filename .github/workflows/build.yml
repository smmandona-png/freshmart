name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare app files
        run: |
          mkdir www
          cp index.html style.css app.js brain.js www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/speech-recognition@7
          npx cap init FreshMart com.smmandona.freshmart --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Make app icon
        run: |
          npm install sharp
          node make-icons.js
      - name: Use fixed signing key
        run: |
          base64 -d debug.keystore.b64 > android/app/fixed.keystore
          mkdir -p ~/.android
          cp android/app/fixed.keystore ~/.android/debug.keystore
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("fixed.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -q signingConfigs android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Check the signing key is the permanent one
        run: |
          WANT=$(keytool -list -v -keystore android/app/fixed.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1)
          GOT=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | head -1)
          echo "want: $WANT"
          echo "got:  $GOT"
          test "$WANT" = "$GOT"
      - uses: actions/upload-artifact@v4
        with:
          name: FreshMart-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
