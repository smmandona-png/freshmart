<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1b7f4b" id="themeMeta">
<title>FreshMart Stock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo" id="hLogo"></div>
  <div class="ht"><h1 id="hName">FreshMart</h1><small>Stock &amp; sales</small></div>
  <button class="gear" onclick="openSettings()" aria-label="Settings">⚙</button>
</header>

<main>
  <section class="sum">
    <div class="hero" onclick="openSales()">
      <div><span>Sold today</span><b id="sToday">K0</b></div>
      <small id="sCount">0 sales<br>tap to view</small>
    </div>
    <div class="mini"><b id="sItems">0</b><span>Products</span></div>
    <div class="mini"><b id="sValue">K0</b><span>Stock worth</span></div>
    <div class="mini"><b id="sProfit">K0</b><span>Profit if sold</span></div>
  </section>

  <section class="cmd">
    <div class="tabs">
      <button class="tab on" id="tStock" onclick="setMode('stock')">📦 Stock in</button>
      <button class="tab" id="tSell" onclick="setMode('sell')">🛒 Sell</button>
    </div>
    <div class="qa-r">
      <input id="qa" autocomplete="off" onkeydown="if(event.key==='Enter')runCmd()">
      <button class="mic" onclick="mic()" aria-label="Speak">🎤</button>
      <button class="go" onclick="runCmd()">Go</button>
    </div>
    <button class="hint-b" onclick="toggleHint()">How do I speak it? ▾</button>
    <div class="qa-t" id="hint" style="display:none"></div>
  </section>

  <div class="tools">
    <div class="chips">
      <button class="chip on" id="cAll" onclick="setFilter('all')">All</button>
      <button class="chip" id="cLow" onclick="setFilter('low')">Low</button>
      <button class="chip" id="cOut" onclick="setFilter('out')">Out</button>
    </div>
    <input id="q" placeholder="Search products…" oninput="render()">
  </div>
  <div id="list"></div>
</main>

<button class="fab" onclick="openForm()">+ Add product</button>
<div id="toast"></div>

<div class="sheet" id="vsheet" onclick="if(event.target===this)closeV()"><div class="panel" id="vpanel"></div></div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeForm()">
  <div class="panel">
    <h2 id="fTitle">New product</h2>
    <label>Product photo (optional)</label>
    <div class="photo">
      <div class="thumb" id="fThumb" onclick="document.getElementById('file').click()">?</div>
      <div style="flex:1">
        <button class="btn s" onclick="document.getElementById('file').click()">📷 Capture photo</button>
        <div class="muted" style="margin-top:6px">No photo? A coloured badge is made from the name.</div>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden onchange="photo(this)">
    <label>Product name</label>
    <input id="fName" placeholder="e.g. Rice 5kg" oninput="calc();preview()">
    <div class="row">
      <div><label>Category</label>
        <select id="fCat"><option>Staples</option><option>Drinks</option><option>Dairy</option><option>Fresh</option><option>Snacks</option><option>Household</option><option>Other</option></select></div>
      <div><label>Unit</label><input id="fUnit" value="pcs" placeholder="pcs, kg, pack"></div>
    </div>
    <div class="row">
      <div><label>Cost price</label><input id="fCost" type="number" inputmode="decimal" step="0.01" oninput="fromMarkup()"></div>
      <div><label>Markup (%)</label><input id="fMark" type="number" inputmode="decimal" step="0.1" value="25" oninput="fromMarkup()"></div>
    </div>
    <label>Selling price — auto, or type your own</label>
    <input id="fSell" type="number" inputmode="decimal" step="0.01" oninput="fromSell()">
    <div class="row">
      <div><label>Quantity in stock</label><input id="fQty" type="number" inputmode="decimal" oninput="calc()"></div>
      <div><label>Low-stock alert at</label><input id="fLow" type="number" inputmode="numeric" value="5"></div>
    </div>
    <div class="calc" id="calc"></div>
    <div class="acts">
      <button class="btn d" id="fDel" style="display:none" onclick="del()">Delete</button>
      <button class="btn s" onclick="closeForm()">Cancel</button>
      <button class="btn p" onclick="save()">Save</button>
    </div>
  </div>
</div>

<div class="sheet" id="rsheet" onclick="if(event.target===this)closeRec()">
  <div class="panel">
    <h2 id="rTitle">Receive stock</h2>
    <label>Quantity arriving</label>
    <input id="rQty" type="number" inputmode="decimal">
    <label>Cost price — leave as is if unchanged</label>
    <input id="rCost" type="number" inputmode="decimal" step="0.01">
    <div class="acts">
      <button class="btn s" onclick="closeRec()">Cancel</button>
      <button class="btn p" onclick="receive()">Add to stock</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
